<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #1f2937;
            font-family: Arial, sans-serif;
        }

        .start-screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;

        }

            background-color: rgba(239, 68, 68, 0.2);
            border: 1px solid #EF4444;
            color: #EF4444;
        }

        .api-status.checking {
            background-color: rgba(59, 130, 246, 0.2);
            border: 1px solid #3B82F6;
            color: #3B82F6;
        }

        .mode-selection {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
            width: 100%;
            max-width: 400px;
        }

        .mode-button {
            padding: 1rem;
            background-color: #374151;
            border: 2px solid #93c5fd;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.1rem;
        }

        .mode-button:hover {
            background-color: #4b5563;
        }

        .mode-button.selected {
            background-color: #1d4ed8;
        }

        .continue-button, .back-button, .try-again-button, .help-button {
            padding: 1rem 2rem;
            background-color: #1d4ed8;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .continue-button:hover, .back-button:hover, .try-again-button:hover, .help-button:hover {
            background-color: #2563eb;
        }

        .button-container {
            display: flex;
            gap: 1rem;
            width: 100%;
            justify-content: center;
        }

        .button-container.dual-buttons .try-again-button,
        .button-container.dual-buttons .help-button {
            flex: 1;
            max-width: 200px;
        }

        .button-container.single-button .try-again-button {
            width: 100%;
            max-width: 400px;
        }

        .game-container {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
            display: none;
        }

        .game-screen {
            width: 100%;
            height: 80%;
            position: relative;
            background-color: white;
            overflow: hidden;
        }

        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .background-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .character {
            position: absolute;
            bottom: 128px;
            z-index: 10;
        }

        .character.mom {
            right: 48px;
        }

        .character.security_officer {
            right: 48px;
        }

        .portrait {

        .portrait img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .dialog-box {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;

            background-color: rgba(17, 24, 39, 0.9);
            padding: 32px;

        .speaker-label {

            border-radius: 4px;
            margin-bottom: 12px;
            font-size: 18px;
        }

        .text-content {
            font-size: 20px;
            margin-bottom: 24px;
            min-height: 30px;
        }

        .description-container {
            display: none;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .description-option {
            padding: 12px;
            background-color: rgba(29, 78, 216, 0.2);
            border: 1px solid #93c5fd;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .description-option:hover {
            background-color: rgba(29, 78, 216, 0.4);
        }

        .description-option.selected {
            background-color: rgba(29, 78, 216, 0.8);
        }

        .writing-container {
            display: none;
            margin-top: 20px;
        }

        .writing-input {
            width: 100%;
            padding: 12px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid #93c5fd;
            border-radius: 4px;
            color: white;
            font-size: 16px;
            margin-bottom: 12px;
        }

        .submit-button {
            padding: 8px 16px;
            background-color: #1d4ed8;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .choice-button {
            width: 100%;
            text-align: left;
            color: white;
            padding: 12px;
            background: none;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .choice-button:hover {
            background-color: #1d4ed8;
        }

        .choice-button::before {
            content: "▶";
            margin-right: 8px;
        }

        .hidden {
            display: none !important;
        }

        .grammar-feedback {
            display: none;
            margin-top: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-left: 3px solid #93c5fd;
            color: white;
        }

        .grammar-feedback h3 {
            margin-bottom: 8px;
            color: #93c5fd;
        }

        .error-list {
            margin-top: 5px;
            padding-left: 20px;
        }

        .loading-indicator {
            display: none;
            color: #93c5fd;
            margin-top: 10px;

        }

        .submit-button:disabled {

        }

        .debug-section {
            margin-top: 15px;

            background: rgba(0, 0, 0, 0.3);

        }

        .debug-section pre {
            white-space: pre-wrap;
            word-break: break-word;

            padding: 8px;
            margin-top: 5px;

        }

        .debug-title {
            color: #93c5fd;
            font-size: 16px;

        }

        .story-selection {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    margin-bottom: 2rem;
    width: 100%;
    max-width: 400px;
}

.story-button {

.story-button:hover {

}

.story-button.selected {

}

        .feedback-container {

        }

    <script>
        // LLM Grammar Checking Function
        async function checkGrammarWithLLM(userAnswer) {
            try {
                console.log('Making API call with:', { userAnswer });
                
                const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer sk-f44597910039474a83b7bda684186951'
                    },
                    body: JSON.stringify({
                        model: "deepseek-chat",
                        messages: [
                            {
                                role: "system",
                                content: "You are a Spanish grammar checker. You must ONLY return a raw JSON object in exactly this format, with no other text, markdown, or formatting: {\"isGrammaticallyCorrect\": boolean, \"spellingErrors\": string[], \"grammarErrors\": string[], \"feedback\": string}. All responses must be valid JSON and follow these rules: Boolean must be true/false (not strings), Arrays must exist even if empty [], Feedback must be a clear explanation, No text before or after the JSON, No markdown or code blocks"
                            },
                            {
                                role: "user",
                                content: `Check this Spanish text: "${userAnswer}"`
                            }
                        ],
                        stream: false
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('API Error Response:', errorText);
                    throw new Error(`API request failed: ${response.status} - ${errorText}`);
                }

                const data = await response.json();
                console.log('Raw API Response:', data);
                
                if (!data.choices || !data.choices[0] || !data.choices[0].message || !data.choices[0].message.content) {
                    console.error('Unexpected API response format:', data);
                    throw new Error(`Invalid API response format. Full response: ${JSON.stringify(data, null, 2)}`);
                }
                
                try {
                    const parsedResult = JSON.parse(data.choices[0].message.content);
                    console.log('Parsed grammar check result:', parsedResult);
                    
                    if (!parsedResult.hasOwnProperty('isGrammaticallyCorrect')) {
                        throw new Error(`Missing required fields in parsed result: ${JSON.stringify(parsedResult, null, 2)}`);
                    }
                    
                    return parsedResult;
                } catch (parseError) {
                    throw new Error(`Failed to parse API response content: ${data.choices[0].message.content}\nError: ${parseError.message}`);
                }
            } catch (error) {
                console.error('Error checking grammar:', error);
                return {
                    error: true,
                    message: error.message,
                    rawResponse: error.rawResponse || null
                };
            }
        }

        // Get detailed help from LLM
        async function getDetailedHelp(userAnswer) {
            try {
                const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer sk-f44597910039474a83b7bda684186951'
                    },
                    body: JSON.stringify({
                        model: "deepseek-chat",
                        messages: [
                            {
                                role: "system",
                                content: "You are a Spanish grammar helper. You must ONLY return a raw JSON object in exactly this format, with no other text, markdown, or formatting: {\"explanation\": string, \"correction\": string}. The explanation should be 1-2 short sentences about the main grammar error. The correction should be a single corrected version of the user's sentence. Example 1 - Input: \"Ayer voy al supermercado\" Output: {\"explanation\": \"You used the wrong verb tense. 'Voy' (present) should be 'fui' (past) when talking about a completed action.\", \"correction\": \"Ayer fui al supermercado.\"} Example 2 - Input: \"El gato es negro y blanco pelos\" Output: {\"explanation\": \"The word order is incorrect. In Spanish, adjectives usually go after the noun they describe.\", \"correction\": \"El gato tiene pelos negros y blancos.\"}"
                            },
                            {
                                role: "user",
                                content: `Check this Spanish text: "${userAnswer}"`
                            }
                        ],
                        stream: false
                    })
                });

                if (!response.ok) {
                    throw new Error(`API request failed: ${response.status}`);
                }

                const data = await response.json();
                const helpData = JSON.parse(data.choices[0].message.content);
                return helpData;
            } catch (error) {
                console.error('Error getting detailed help:', error);
                return {
                    error: true,
                    message: error.message
                };
            }
        }

        // Sample content for testing
        const sampleContent = {
            dialogues: [
                {

                    choices: [
                        {

                            description: "Write a sentence about your day in Spanish",

        // Game Modes
        const GameModes = {
            REGULAR: 'regular',
            LISTENING: 'listening',
            WRITING: 'writing',
            ADVANCED: 'advanced'
        };

        // Game state
let gameState = {
    currentStoryId: null,
    currentLocation: null,
    currentDialogue: 0,
    currentText: '',
    isTyping: true,
    showChoices: false,
    activeSpeaker: 'narrator',
    momEmotion: 'normal',
    locationData: null,
    selectedMode: null,
    selectedDescription: null,
    isCheckingGrammar: false,
    lastUserAnswer: '',

};

        // Audio Controller
class AudioController {
    constructor() {
        this.narrationAudio = null;
        this.ambientAudio = new Audio();
        this.ambientAudio.loop = true;
        this.narrationVolume = 1.0;
        this.ambientVolume = 0.05;
    }

    playNarration(location, dialogueId) {
        this.stopNarration();
        const storyPath = gameState.currentStoryId ? `stories/${gameState.currentStoryId}/` : '';
        this.narrationAudio = new Audio(`${storyPath}audio/narration/${location}/dialogue${dialogueId}.mp3`);
        this.narrationAudio.volume = this.narrationVolume;
        
        this.narrationAudio.onerror = () => {
            console.warn(`Audio file for ${location} dialogue ${dialogueId} not found`);
        };
        
        const playPromise = this.narrationAudio.play();
        if (playPromise !== undefined) {
            playPromise.catch(error => {
                console.warn("Narration audio playback failed:", error);
            });
        }
    }

    playAmbient(location) {
        if (!this.ambientAudio.src || this.ambientAudio.paused) {
            const storyPath = gameState.currentStoryId ? `stories/${gameState.currentStoryId}/` : '';
            this.ambientAudio.src = `${storyPath}audio/ambient/${location}.mp3`;
            this.ambientAudio.volume = this.ambientVolume;
            
            this.ambientAudio.onerror = () => {
                console.warn(`Ambient audio file for ${location} not found`);
            };
            
            const playPromise = this.ambientAudio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.warn("Ambient audio playback failed:", error);
                });
            }
        }
    }

    stopNarration() {
        if (this.narrationAudio) {
            this.narrationAudio.pause();
            this.narrationAudio.currentTime = 0;
        }
    }

    stopAmbient() {
        this.ambientAudio.pause();
        this.ambientAudio.currentTime = 0;
    }
}

async function loadAvailableStories() {
    try {
        const response = await fetch('stories/');
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const text = await response.text();
        console.log('Directory listing response:', text);
        
        const parser = new DOMParser();
        const doc = parser.parseFromString(text, 'text/html');
        const links = Array.from(doc.querySelectorAll('a'));
        
        const stories = links
            .map(link => {
                const href = link.getAttribute('href');
                if (!href) return null;
                
                const match = href.match(/^Story(\d+)\s*-\s*(.+?)\/?$/i);
                if (!match) return null;
                
                return {
                    id: `Story${match[1]}`,
                    number: parseInt(match[1]),
                    title: match[2].replace(/-/g, ' ').trim(),
                    folderName: href.replace(/\/$/, '')
                };
            })
            .filter(story => story !== null)
            .sort((a, b) => a.number - b.number);

        console.log('Found stories:', stories);
        
        // Update the UI based on whether stories were found
        const storySelection = document.getElementById('story-selection');
        const gameTitle = document.querySelector('.game-title');
        
        gameTitle.textContent = "Choose a Story";
        
        if (stories && stories.length > 0) {
            storySelection.innerHTML = '';
            stories.forEach(story => {
                const btn = document.createElement('button');
                btn.className = 'story-button';
                btn.textContent = story.title;
                btn.onclick = () => {
                    const allBtns = document.querySelectorAll('.story-button');
                    allBtns.forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    gameState.currentStoryId = story.id;
                };
                storySelection.appendChild(btn);
            });
        } else {
            storySelection.innerHTML = '<div class="no-stories">No stories found.</div>';
        }
        
        return stories;
    } catch (error) {
        console.error('Error loading stories:', error);
        const storySelection = document.getElementById('story-selection');
        storySelection.innerHTML = '<div class="no-stories">No stories found.</div>';
        return [];
    }
}

        // DOM elements
        const startScreen = document.getElementById('start-screen');
        const gameContainer = document.getElementById('game-container');
        const modeButtons = document.querySelectorAll('.mode-button');
        const continueButton = document.getElementById('continue-button');
        const textContent = document.getElementById('text-content');
        const speakerLabel = document.getElementById('speaker-label');
        const choicesContainer = document.getElementById('choices');
        const descriptionContainer = document.getElementById('description-container');
        const writingContainer = document.getElementById('writing-container');
        const writingInput = document.getElementById('writing-input');
        const submitButton = document.getElementById('submit-button');
        const loadingIndicator = document.getElementById('loading-indicator');
        const grammarFeedback = document.getElementById('grammar-feedback');
        const momPortrait = document.getElementById('mom-portrait');
        const backgroundImage = document.getElementById('location-background');
        const backButton = document.getElementById('back-button');
        const nextDialogueButton = document.getElementById('next-dialogue-button');
        const tryAgainButton = document.getElementById('try-again-button');
        const helpButton = document.getElementById('help-button');
        const feedbackButtons = document.getElementById('feedback-buttons');

        // API Status check
        async function checkAPIConnection() {
            const apiStatus = document.getElementById('api-status');
            apiStatus.className = 'api-status checking';
            apiStatus.textContent = 'Checking API connection...';

            try {
                const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer sk-f44597910039474a83b7bda684186951'
                    },
                    body: JSON.stringify({
                        model: "deepseek-chat",
                        messages: [
                            {
                                role: "system",
                                content: "Test connection"
                            },
                            {
                                role: "user",
                                content: "Test"
                            }
                        ],
                        stream: false
                    })
                });

                if (response.ok) {
                    apiStatus.className = 'api-status connected';
                    apiStatus.textContent = 'API Connected ✓';
                    return true;
                } else {
                    const errorText = await response.text();
                    console.error('API Error Response:', errorText);
                    throw new Error(`API connection failed: ${response.status}`);
                }
            } catch (error) {
                apiStatus.className = 'api-status error';
                apiStatus.textContent = 'API Connection Error ✗';
                console.error('API Connection Error:', error);
                return false;
            }
        }

        // Initialize audio controller
        const audioController = new AudioController();

        // Check API connection on page load
        checkAPIConnection();

        // Event Listeners for new buttons
        tryAgainButton.addEventListener('click', () => {
            // Hide feedback and restore original UI
            grammarFeedback.style.display = 'none';
            feedbackButtons.classList.add('hidden');
            tryAgainButton.classList.add('hidden');
            helpButton.classList.add('hidden');
            
            // Show input elements
            writingInput.value = '';
            writingInput.style.display = 'block';
            submitButton.style.display = 'block';
            
            // Show character elements
            document.querySelector(`.character.${gameState.activeSpeaker}`).classList.remove('hidden');
            speakerLabel.classList.remove('hidden');
            
            // Reset state
            gameState.currentText = '';
            startDialogue();
        });

        helpButton.addEventListener('click', async () => {
            // Show loading state
            loadingIndicator.style.display = 'block';
            helpButton.disabled = true;

            try {
                // Get detailed help
                const helpContent = await getDetailedHelp(gameState.lastUserAnswer);
                
                // Hide dialogue text
                textContent.style.display = 'none';

                if (helpContent.error) {
                    grammarFeedback.innerHTML = `
                        <h3>Error</h3>
                        <p>${helpContent.message}</p>
                    `;
                } else {
                    // Clear previous feedback and show new help content
                    grammarFeedback.innerHTML = `
                        <h3>Grammar Issue</h3>
                        <p>${helpContent.explanation}</p>
                        <h3>Correction</h3>
                        <p>${helpContent.correction}</p>
                    `;
                }
                
                // Update button visibility
                helpButton.classList.add('hidden');
                feedbackButtons.classList.remove('dual-buttons');
                feedbackButtons.classList.add('single-button');
                
            } catch (error) {
                console.error('Error getting help:', error);
                grammarFeedback.innerHTML += '<p>Error getting detailed help. Please try again.</p>';
            } finally {
                loadingIndicator.style.display = 'none';
                helpButton.disabled = false;
            }
        });

        // Start Screen Handlers
        modeButtons.forEach(button => {
            button.addEventListener('click', () => {
                modeButtons.forEach(btn => btn.classList.remove('selected'));
                button.classList.add('selected');
                gameState.selectedMode = button.dataset.mode;
            });
        });

continueButton.addEventListener('click', () => {
    if (gameState.selectedMode) {
        const modeSelection = document.querySelector('.mode-selection');
        modeSelection.style.display = 'none';
        document.querySelector('.game-title').textContent = "Choose a Story";
        document.querySelector('.story-selection').style.display = 'flex';
        continueButton.onclick = () => {
            if (gameState.currentStoryId) {
                startScreen.style.display = 'none';
                gameContainer.style.display = 'block';
                loadLocation('departure_terminal');
            }
        };
    }
});

        // Back button handler
        backButton.addEventListener('click', () => {
            writingContainer.style.display = 'none';
            backButton.classList.add('hidden');
            grammarFeedback.style.display = 'none';
            nextDialogueButton.classList.add('hidden');
            descriptionContainer.style.display = 'flex';
            writingInput.value = '';
            feedbackButtons.classList.add('hidden');
            tryAgainButton.classList.add('hidden');
            helpButton.classList.add('hidden');
        });

        // Submit button handler
        submitButton.addEventListener('click', async () => {
            if (gameState.isCheckingGrammar) return;

            const userAnswer = writingInput.value.trim();
            if (!userAnswer) {
                showFeedback('Please enter your answer first.', 'warning');
                return;
            }

            gameState.lastUserAnswer = userAnswer;

            // Show loading state
            gameState.isCheckingGrammar = true;
            loadingIndicator.style.display = 'block';
            submitButton.disabled = true;

            try {
                const result = await checkGrammarWithLLM(userAnswer);
                
                if (result.error) {
                    // Display error with debug information
                    grammarFeedback.innerHTML = `
                        <h3>Error</h3>
                        <p>Sorry, there was an error checking your grammar. Details below:</p>
                        <div class="debug-section">
                            <div class="debug-title">Error Message:</div>
                            <pre>${result.message}</pre>
                            ${result.rawResponse ? `
                                <div class="debug-title">Raw Response:</div>
                                <pre>${JSON.stringify(result.rawResponse, null, 2)}</pre>
                            ` : ''}
                        </div>
                    `;
                } else {
                    // Handle correct/incorrect answer
                    if (result.isGrammaticallyCorrect) {
                        // Show success feedback and continue button
                        textContent.style.display = 'none';
                        grammarFeedback.innerHTML = `
                            <h3>Grammar Check Results</h3>
                            <p>${result.feedback}</p>
                        `;
                        nextDialogueButton.classList.remove('hidden');
                        writingInput.style.display = 'none';
                        submitButton.style.display = 'none';
                        const speakerElement = document.querySelector(`.character.${gameState.activeSpeaker}`);
                        if (speakerElement) {
                            speakerElement.classList.add('hidden');
                        }
                        speakerLabel.classList.add('hidden');
                    } else {
                        // Show error feedback and try again/help buttons
                        grammarFeedback.innerHTML = `
                            <h3>Grammar Check Results</h3>
                            <p>${result.feedback}</p>
                            ${result.spellingErrors.length > 0 ? `
                                <h3>Spelling Errors:</h3>
                                <ul class="error-list">
                                    ${result.spellingErrors.map(error => `<li>${error}</li>`).join('')}
                                </ul>
                            ` : ''}
                            ${result.grammarErrors.length > 0 ? `
                                <h3>Grammar Errors:</h3>
                                <ul class="error-list">
                                    ${result.grammarErrors.map(error => `<li>${error}</li>`).join('')}
                                </ul>
                            ` : ''}
                        `;
                        
                        // Hide input elements
                        writingInput.style.display = 'none';
                        submitButton.style.display = 'none';
                        const speakerElement = document.querySelector(`.character.${gameState.activeSpeaker}`);
                        if (speakerElement) {
                            speakerElement.classList.add('hidden');
                        }
                        speakerLabel.classList.add('hidden');
                        
                        // Show feedback buttons
                        feedbackButtons.classList.remove('hidden');
                        feedbackButtons.classList.add('dual-buttons');
                        tryAgainButton.classList.remove('hidden');
                        helpButton.classList.remove('hidden');
                    }
                }
                
                grammarFeedback.style.display = 'block';
                
            } catch (error) {
                console.error('Error during grammar check:', error);
                grammarFeedback.innerHTML = `
                    <h3>Error</h3>
                    <p>An unexpected error occurred. Details below:</p>
                    <div class="debug-section">
                        <div class="debug-title">Error Details:</div>
                        <pre>${error.message}</pre>
                    </div>
                `;
                grammarFeedback.style.display = 'block';
            } finally {
                // Reset loading state
                gameState.isCheckingGrammar = false;
                loadingIndicator.style.display = 'none';
                submitButton.disabled = false;
            }
        });

        // Next dialogue button handler
nextDialogueButton.addEventListener('click', () => {
    const currentChoice = gameState.selectedDescription;
    if (!currentChoice) return;

    // Clear all UI states first
    writingContainer.style.display = 'none';
    backButton.classList.add('hidden');
    grammarFeedback.style.display = 'none';
    nextDialogueButton.classList.add('hidden');
    writingInput.value = '';
    feedbackButtons.classList.add('hidden');
    tryAgainButton.classList.add('hidden');
    helpButton.classList.add('hidden');
    
    if (currentChoice.nextLocation) {
        loadLocation(currentChoice.nextLocation);
    } else if (currentChoice.nextDialogue !== undefined) {
        // Reset input visibility
        writingInput.style.display = 'block';
        submitButton.style.display = 'block';
        
        // Advance to next dialogue
        gameState.currentDialogue = currentChoice.nextDialogue;
        gameState.currentText = '';
        gameState.isTyping = true;
        gameState.showChoices = false;
        gameState.selectedDescription = null;

        if (gameState.locationData.dialogues[currentChoice.nextDialogue]) {
            gameState.activeSpeaker = gameState.locationData.dialogues[currentChoice.nextDialogue].speaker;
        }

        // Show character elements
        const speakerElement = document.querySelector(`.character.${gameState.activeSpeaker}`);
        if (speakerElement) {
            speakerElement.classList.remove('hidden');
        }
        speakerLabel.classList.remove('hidden');

        updatePortraits();
        updateSpeakerLabel();
        typeText();
    }
});

        // Utility functions
function updatePortraits() {
    const characters = document.querySelectorAll('.character');
    characters.forEach(character => {
        character.classList.add('hidden');
    });

    if (gameState.activeSpeaker !== 'narrator') {
        const speakerElement = document.querySelector(`.character.${gameState.activeSpeaker}`);
        if (speakerElement) {
            speakerElement.classList.remove('hidden');
        }
    }

    const storyPath = gameState.currentStoryId ? `stories/${gameState.currentStoryId}/` : '';
    momPortrait.src = `${storyPath}images/characters/mom/${gameState.momEmotion}.png`;
    document.querySelector('#security-officer-portrait').src = 
        `${storyPath}images/characters/security_officer/normal.png`;
}

        function updateSpeakerLabel() {
            if (gameState.activeSpeaker === 'narrator') {
                speakerLabel.classList.add('hidden');
            } else {
                speakerLabel.classList.remove('hidden');
                speakerLabel.textContent = gameState.activeSpeaker.charAt(0).toUpperCase() + 
                                         gameState.activeSpeaker.slice(1).replace('_', ' ');
            }
        }

function updateBackground() {
    const storyPath = gameState.currentStoryId ? `stories/${gameState.currentStoryId}/` : '';
    backgroundImage.src = `${storyPath}images/locations/${gameState.currentLocation}.jpg`;
}

async function loadLocation(locationName) {
    try {
        try {
            const storyPath = gameState.currentStoryId ? `stories/${gameState.currentStoryId}/` : '';
            const response = await fetch(`${storyPath}content/${locationName}.json`);
            const locationData = await response.json();
            gameState.locationData = locationData;
        } catch (e) {
            console.log('Using sample content for testing');
            gameState.locationData = sampleContent;
        }
        
        gameState.currentLocation = locationName;
        gameState.currentDialogue = 0;
        gameState.currentText = '';
        gameState.isTyping = true;
        gameState.showChoices = false;
        gameState.selectedDescription = null;
        
        textContent.textContent = '';
        choicesContainer.innerHTML = '';
        descriptionContainer.innerHTML = '';
        
        updateBackground();
        
        audioController.stopNarration();
        audioController.playAmbient(locationName);
        
        startDialogue();
    } catch (error) {
        console.error('Error loading location:', error);
    }
}

function typeText() {
    const currentDialogue = gameState.locationData.dialogues[gameState.currentDialogue];
    
    // If in listening mode, skip text display entirely
    if (gameState.selectedMode === GameModes.LISTENING) {
        gameState.currentText = currentDialogue.text;
        audioController.playNarration(gameState.currentLocation, gameState.currentDialogue);
        setTimeout(() => {
            gameState.isTyping = false;
            gameState.showChoices = true;
            showChoices();
        }, 50);
        return;
    }

    if (gameState.currentText.length === 0) {
        audioController.playNarration(gameState.currentLocation, gameState.currentDialogue);
    }

    if (gameState.currentText.length < currentDialogue.text.length) {
        gameState.currentText = currentDialogue.text.slice(0, gameState.currentText.length + 1);
        textContent.textContent = gameState.currentText;
        setTimeout(typeText, 50);
    } else {
        gameState.isTyping = false;
        gameState.showChoices = true;
        showChoices();
    }
}

        function showFeedback(message, type) {
            grammarFeedback.innerHTML = `<p class="${type}">${message}</p>`;
            grammarFeedback.style.display = 'block';
        }

function showChoices() {
    const currentDialogue = gameState.locationData.dialogues[gameState.currentDialogue];
    
    // Reset UI elements first
    textContent.style.display = 'none';
    choicesContainer.style.display = 'none';
    descriptionContainer.style.display = 'none';
    writingContainer.style.display = 'none';
    
    // If the speaker is narrator, always use regular mode behavior
    if (currentDialogue.speaker === 'narrator') {
        textContent.style.display = 'block';
        handleRegularMode(currentDialogue);
    } else {
        // For character dialogues, use the selected game mode
        switch(gameState.selectedMode) {
            case GameModes.REGULAR:
                textContent.style.display = 'block';
                handleRegularMode(currentDialogue);
                break;
            case GameModes.LISTENING:
                handleListeningMode(currentDialogue);
                break;
            case GameModes.WRITING:
                textContent.style.display = 'block';
                handleWritingMode(currentDialogue);
                break;
            case GameModes.ADVANCED:
                handleAdvancedMode(currentDialogue);
                break;
        }
    }
}

        // Game Mode specific functions
        function handleRegularMode(dialogue) {
            textContent.style.display = 'block';
            choicesContainer.style.display = 'flex';
            descriptionContainer.style.display = 'none';
            writingContainer.style.display = 'none';
            grammarFeedback.style.display = 'none';
            backButton.classList.add('hidden');
            nextDialogueButton.classList.add('hidden');
            feedbackButtons.classList.add('hidden');
            tryAgainButton.classList.add('hidden');
            helpButton.classList.add('hidden');
            
            choicesContainer.innerHTML = '';
            dialogue.choices.forEach(choice => {
                const button = document.createElement('button');
                button.className = 'choice-button';
                button.textContent = choice.text;
                button.onclick = () => makeChoice(choice);
                choicesContainer.appendChild(button);
            });
        }

function handleListeningMode(dialogue) {
    // Don't manipulate text display here, it's handled in showChoices
    choicesContainer.style.display = 'flex';
    
    choicesContainer.innerHTML = '';
    dialogue.choices.forEach(choice => {
        const button = document.createElement('button');
        button.className = 'choice-button';
        button.textContent = choice.text;
        button.onclick = () => makeChoice(choice);
        choicesContainer.appendChild(button);
    });
}

        function handleWritingMode(dialogue) {
            textContent.style.display = 'block';
            choicesContainer.style.display = 'none';
            descriptionContainer.style.display = 'flex';
            writingContainer.style.display = 'none';
            grammarFeedback.style.display = 'none';
            backButton.classList.add('hidden');
            nextDialogueButton.classList.add('hidden');
            feedbackButtons.classList.add('hidden');
            tryAgainButton.classList.add('hidden');
            helpButton.classList.add('hidden');
            
            descriptionContainer.innerHTML = '';
            dialogue.choices.forEach(choice => {
                const description = document.createElement('div');
                description.className = 'description-option';
                description.textContent = choice.description;
                description.onclick = () => selectDescription(choice);
                descriptionContainer.appendChild(description);
            });
        }

        function handleAdvancedMode(dialogue) {
            textContent.style.display = 'none';
            choicesContainer.style.display = 'none';
            descriptionContainer.style.display = 'flex';
            writingContainer.style.display = 'none';
            grammarFeedback.style.display = 'none';
            backButton.classList.add('hidden');
            nextDialogueButton.classList.add('hidden');
            feedbackButtons.classList.add('hidden');
            tryAgainButton.classList.add('hidden');
            helpButton.classList.add('hidden');
            
            descriptionContainer.innerHTML = '';
            dialogue.choices.forEach(choice => {
                const description = document.createElement('div');
                description.className = 'description-option';
                description.textContent = choice.description;
                description.onclick = () => selectDescription(choice);
                descriptionContainer.appendChild(description);
            });
        }

function selectDescription(choice) {
    gameState.selectedDescription = choice;
    
    // Clear existing UI elements
    descriptionContainer.style.display = 'none';
    const descriptions = descriptionContainer.querySelectorAll('.description-option');
    descriptions.forEach(desc => desc.classList.remove('selected'));
    
    // Show writing container and its elements
    writingContainer.style.display = 'block';
    writingInput.style.display = 'block';
    submitButton.style.display = 'block';
    backButton.classList.remove('hidden');
    
    // Reset input and set focus
    writingInput.value = '';
    writingInput.focus();
    
    // Set selected state on clicked description
    if (event && event.target) {
        event.target.classList.add('selected');
    }
}

function makeChoice(choice) {
    console.log('Making choice:', choice);
    audioController.stopNarration();

    if (choice.nextLocation) {
        // Clear existing UI elements before loading new location
        choicesContainer.innerHTML = '';
        descriptionContainer.innerHTML = '';
        writingContainer.style.display = 'none';
        grammarFeedback.style.display = 'none';
        backButton.classList.add('hidden');
        nextDialogueButton.classList.add('hidden');
        feedbackButtons.classList.add('hidden');
        tryAgainButton.classList.add('hidden');
        helpButton.classList.add('hidden');
        
        // Reset game state
        gameState.currentText = '';
        gameState.isTyping = true;
        gameState.showChoices = false;
        gameState.selectedDescription = null;
        
        loadLocation(choice.nextLocation);
    } else if (choice.nextDialogue !== undefined) {
        gameState.currentDialogue = choice.nextDialogue;
        gameState.currentText = '';
        gameState.isTyping = true;
        gameState.showChoices = false;
        
        if (gameState.locationData.dialogues[choice.nextDialogue]) {
            gameState.activeSpeaker = gameState.locationData.dialogues[choice.nextDialogue].speaker;
        }
        
        // Clear UI elements
        choicesContainer.innerHTML = '';
        descriptionContainer.innerHTML = '';
        writingContainer.style.display = 'none';
        grammarFeedback.style.display = 'none';
        backButton.classList.add('hidden');
        nextDialogueButton.classList.add('hidden');
        feedbackButtons.classList.add('hidden');
        tryAgainButton.classList.add('hidden');
        helpButton.classList.add('hidden');
        
        updatePortraits();
        updateSpeakerLabel();
        typeText();
    }
}

function startDialogue() {
    const currentDialogue = gameState.locationData.dialogues[gameState.currentDialogue];
    gameState = {
        ...gameState,
        currentText: '',
        isTyping: true,
        showChoices: false,
        activeSpeaker: currentDialogue.speaker
    };
    
    // Reset UI visibility based on mode
    if (gameState.selectedMode === GameModes.LISTENING) {
        textContent.style.display = 'none';
    } else {
        textContent.style.display = 'block';
    }
    
    updatePortraits();
    updateSpeakerLabel();
    typeText();
}

        // Cleanup function
        function cleanup() {
            audioController.stopNarration();
            audioController.stopAmbient();
        }

        // Add event listener for page unload
        window.addEventListener('beforeunload', cleanup);
        
  const storySelection = document.getElementById('story-selection');

loadAvailableStories().then(stories => {
    console.log('Stories found:', stories);
    
    const sel = document.getElementById('story-selection');
    console.log('Selection div found:', sel);
    
    storySelection.innerHTML = '';
    
    if (stories && stories.length > 0) {
        stories.forEach(story => {
            console.log('Creating button for:', story);
            const btn = document.createElement('button');
            btn.className = 'story-button';
            btn.textContent = story.title;
            btn.onclick = () => {
                const allBtns = document.querySelectorAll('.story-button');
                allBtns.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                gameState.currentStoryId = story.id;
                console.log('Selected story:', story.id);
            };
            storySelection.appendChild(btn);
        });
    } else {
        console.log('No stories found');
    }
});
    </script>
